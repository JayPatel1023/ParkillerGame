<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Parkiller</title>
    <meta name="theme-color" content="#ccb154" />
    <!-- iOS Safari doesn't fully honor the Web App Manifest - these are the separate tags it
         actually reads for "Add to Home Screen" (standalone launch, status bar style, home
         screen icon, splash screen background matching the manifest's). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Parkiller" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
