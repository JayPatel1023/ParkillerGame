<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Parkiller</title>
    <meta name="theme-color" content="#ccb154" />
    <!-- No favicon.ico exists (this app ships PNG icons for the PWA manifest instead) - without an
         explicit <link rel="icon">, the browser still probes /favicon.ico on its own and logs a
         404 in the console for a file that was never meant to exist. Pointing it at the same icon
         the manifest already uses stops that probe. -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <!-- iOS Safari doesn't fully honor the Web App Manifest - these are the separate tags it
         actually reads for "Add to Home Screen" (standalone launch, status bar style, home
         screen icon, splash screen background matching the manifest's). mobile-web-app-capable is
         the standards-track replacement Chrome/Android actually reads now (apple-mobile-web-app-
         capable logs a "deprecated" console warning there) - kept alongside it, not instead of it,
         since Safari still only honors the apple-prefixed one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Parkiller" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Reported directly, reproduced under a throttled connection: on a slow first load, the
         board texture (and the track-square tile images every board uses) can stay unloaded for
         several real seconds after the game screen itself is already interactive - the render-time
         fetch (useRobustTexture.ts's own preloadTexture, called from App.tsx as early as that code
         can run) can't start until the whole JS bundle has downloaded, parsed, and mounted React,
         which is itself the slow part on a bad connection. A browser-level preload hint starts
         these three specific fetches immediately on HTML parse, in parallel with the JS bundle
         rather than after it - by the time App.tsx's own preloadTexture call runs, these are
         already well underway (or done), so it becomes a same-URL cache hit instead of a fresh
         fetch. board_4p.webp matches PlayerCountSelector's own default selection (App.tsx's
         `useState(4)`) - the single most likely board a first-time visitor actually needs; the two
         tile images are shared by every board regardless of player count.

         Reported directly, via a browser console screenshot ("preloaded... but not used" warning):
         this still pointed at board_4p.jpg after generated-boards.json's own boardImage field
         switched to board_4p.webp (see that file's own git history) - the preload fetched a file
         nothing in the running app ever actually requests anymore, silently defeating its entire
         purpose (the real board_4p.webp got no early-start head start at all) while still spending
         real bandwidth on a fetch that goes completely unused.

         crossorigin="anonymous" matters, not decorative - confirmed directly via a console warning
         ("preload... not used because the request credentials mode does not match") without it:
         THREE.Loader (the base TextureLoader/ImageLoader every texture load in this app goes
         through - see useRobustTexture.ts) defaults its own crossOrigin to 'anonymous', and a
         preload's credentials mode has to match the real request's exactly or the browser treats
         them as different resources entirely, fetching the image *twice* - once for the unused
         preload, once for real - which silently defeated this whole preload's own purpose. -->
    <link rel="preload" href="/boards/board_4p.webp" as="image" crossorigin="anonymous" />
    <link rel="preload" href="/tiles/tile-fill.png" as="image" crossorigin="anonymous" />
    <link rel="preload" href="/tiles/tile-border.png" as="image" crossorigin="anonymous" />
    <!-- Requested directly, for the "Jugar online" redesign (a reference mockup: a bold rounded
         display face for "Jugar online" itself/section headings, plus a casual handwritten face
         for the small doodle annotations scattered around it, e.g. "Let's Play!") - the app had no
         custom webfont at all before this, just system-ui. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
